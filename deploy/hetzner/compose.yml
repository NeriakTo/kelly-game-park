services:
  kellygames:
    build: ../..
    image: kellygames:local
    ports:
      - "127.0.0.1:3020:8080"
    env_file: /opt/kellygames/secrets.env
    volumes:
      - /opt/kellygames/data:/data
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
